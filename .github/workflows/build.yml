name: Build Release
run-name: Build Android Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.6"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, package, and publish Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and release notes
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version: ${VERSION}"
            echo "The version must start with v and contain only letters, digits, dots, underscores, or hyphens."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          APP_VERSION=$(sed -n 's/^nrfr.versionName=//p' gradle.properties)
          if [[ "${VERSION}" != "v${APP_VERSION}" ]]; then
            echo "Release tag ${VERSION} does not match app version ${APP_VERSION}."
            exit 1
          fi

          VERSION_HEADER="## ${VERSION}"
          awk -v header="${VERSION_HEADER}" '
            index($0, header) == 1 { capture = 1 }
            capture && /^## / && index($0, header) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "No changelog entry found for ${VERSION}."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure optional CI release signing
        id: signing
        shell: bash
        env:
          NRFR_SIGNING_KEYSTORE_BASE64: ${{ secrets.NRFR_RELEASE_KEYSTORE_BASE64 }}
          NRFR_SIGNING_STORE_FILE: ${{ runner.temp }}/nrfr-release.jks
          NRFR_SIGNING_STORE_PASSWORD: ${{ secrets.NRFR_RELEASE_STORE_PASSWORD }}
          NRFR_SIGNING_KEY_ALIAS: ${{ secrets.NRFR_RELEASE_KEY_ALIAS }}
          NRFR_SIGNING_KEY_PASSWORD: ${{ secrets.NRFR_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = (
              "NRFR_SIGNING_KEYSTORE_BASE64", "NRFR_SIGNING_STORE_PASSWORD",
              "NRFR_SIGNING_KEY_ALIAS", "NRFR_SIGNING_KEY_PASSWORD",
          )
          missing = [key for key in required if not os.environ.get(key)]
          output = Path(os.environ["GITHUB_OUTPUT"])
          if len(missing) == len(required):
              with output.open("a") as stream:
                  stream.write("ready=false\n")
              print("No CI signing secrets: run Release checks and skip automatic publishing.")
              raise SystemExit(0)
          if missing:
              raise SystemExit("Missing release signing secrets: " + ", ".join(missing))
          path = Path(os.environ["NRFR_SIGNING_STORE_FILE"])
          path.write_bytes(base64.b64decode(os.environ["NRFR_SIGNING_KEYSTORE_BASE64"], validate=True))
          path.chmod(0o600)
          with output.open("a") as stream:
              stream.write("ready=true\n")
              stream.write("store_file=" + str(path) + "\n")
          PY

      - name: Test and build Release APKs
        shell: bash
        env:
          NRFR_SIGNING_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          NRFR_SIGNING_STORE_PASSWORD: ${{ secrets.NRFR_RELEASE_STORE_PASSWORD }}
          NRFR_SIGNING_KEY_ALIAS: ${{ secrets.NRFR_RELEASE_KEY_ALIAS }}
          NRFR_SIGNING_KEY_PASSWORD: ${{ secrets.NRFR_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :instrumentation-target:assembleRelease

      - name: Collect release assets
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/nrfr-${RELEASE_VERSION}.apk"
          cp instrumentation-target/build/outputs/apk/release/instrumentation-target-release.apk "artifacts/nrfr-instrumentation-target-${RELEASE_VERSION}.apk"
          EXPECTED_CERT="72c45f53872baa403d9bfb1c1f3eb6bedba6dabd1b7ab29c42f7d807b7131d49"
          for APK in artifacts/*.apk; do
            CERTS=$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${APK}")
            grep -F "Signer #1 certificate SHA-256 digest: ${EXPECTED_CERT}" <<< "${CERTS}"
            BADGING=$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "${APK}")
            if grep -q '^application-debuggable' <<< "${BADGING}"; then
              echo "Refusing to publish a debuggable APK: ${APK}"
              exit 1
            fi
          done
          cd artifacts
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nrfr-android-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/nrfr-${{ steps.version.outputs.version }}.apk
            artifacts/nrfr-instrumentation-target-${{ steps.version.outputs.version }}.apk
            artifacts/SHA256SUMS.txt

      - name: Remove temporary signing file
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/nrfr-release.jks"
